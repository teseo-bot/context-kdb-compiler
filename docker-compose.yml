version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: crm_agentico_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crm_agentico_kdb
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
