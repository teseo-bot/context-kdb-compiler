name: Deploy Compiler to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: teseocontextkdb
  REGION: us-central1
  SERVICE_NAME: context-kdb-compiler
  GAR_LOCATION: us-central1-docker.pkg.dev
  REPOSITORY: teseo-context-repo
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/137810875111/locations/global/workloadIdentityPools/github-actions/providers/github-actions-provider'
          service_account: 'github-deployer@teseocontextkdb.iam.gserviceaccount.com'

      - run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}

      - run: docker build -t ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }} .

      - run: docker push ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          env_vars: |
            NODE_ENV=production
          flags: --add-cloudsql-instances=teseocontextkdb:us-central1:context-kdb-db

          secrets: |
            DATABASE_URL=DATABASE_URL:latest
            GEMINI_DIRECT_KEY=GEMINI_DIRECT_KEY:latest
            M2M_API_KEY=M2M_API_KEY:latest
          env_vars_update_strategy: merge
          secrets_update_strategy: merge
